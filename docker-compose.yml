services:
  postgres:
    image: postgres:17
    container_name: reading-diary-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: reading_diary
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-1Fev2006}
    ports:
      - "5433:5432"
    volumes:
      - reading-diary-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d reading_diary"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  reading-diary-pgdata:
